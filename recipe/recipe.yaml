schema_version: 1

context:
  name: linux-perf
  version: "7.1.4"
  # perf requires libtraceevent, which was removed from the kernel tree in 6.2
  # and is not packaged on conda-forge, so it is built here and linked statically
  traceevent_version: "1.9.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  - url: https://cdn.kernel.org/pub/linux/kernel/v${{ (version | split("."))[0] }}.x/linux-${{ version }}.tar.xz
    sha256: 1c63922a119675d38e3ae0f8f6ee07f15c41a786ab9ed66563749bb8c9a08e2e
  - url: https://git.kernel.org/pub/scm/libs/libtrace/libtraceevent.git/snapshot/libtraceevent-${{ traceevent_version }}.tar.gz
    sha256: e6d82cb2392d04866203387fa092692e4282ccc36c8235dc129afd1ceba12684
    target_directory: libtraceevent

build:
  number: 0
  skip: not linux

requirements:
  build:
    - ${{ compiler('c') }}
    # perf links libstdc++ for the C++ demangler
    - ${{ compiler('cxx') }}
    - ${{ stdlib("c") }}
    - make
    - flex
    - bison
    - pkg-config
  host:
    - elfutils
    # capstone provides the headers, libcapstone the lib and its run_exports
    - capstone
    - libcapstone
    - libnuma
    - slang
    - liblzma-devel
    - zlib
    - zstd
    - python
    - setuptools
  run:
    - python
    - libnuma

tests:
  - script:
      - perf list

about:
  summary: Performance analysis tools for Linux
  description: |
    Performance counters for Linux are a new kernel-based subsystem that
    provide a framework for all things performance analysis. It covers hardware
    level (CPU/PMU, Performance Monitoring Unit) features and software features
    (software counters, tracepoints) as well.
  license: GPL-2.0-only
  license_file: LICENSES/preferred/GPL-2.0
  homepage: https://www.kernel.org
  documentation: https://docs.kernel.org/

extra:
  recipe-maintainers:
    - chrisburr
